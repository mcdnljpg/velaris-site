<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELARIS | Minecraft Server</title>
    <style>
        /* Сброс стилей и настройка фона */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Фоновая картинка (замени URL на свою, если нужно) */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://i.imgur.com/8QO9Y3v.png') no-repeat center center/cover; /* ВСТАВЬ СЮДА ССЫЛКУ НА СВОЙ АРТ С ЗАМКОМ */
            opacity: 0.4;
            z-index: -1;
        }

        /* Контейнер по центру */
        .container {
            text-align: center;
            background: rgba(10, 10, 10, 0.8);
            padding: 40px 60px;
            border-radius: 20px;
            border: 2px solid #8A2BE2;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.5);
            max-width: 500px;
            width: 90%;
        }

        /* Логотип */
        .logo {
            width: 150px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px #8A2BE2);
        }

        /* Заголовок */
        h1 {
            font-size: 36px;
            margin: 0 0 10px 0;
            color: #ffffff;
            text-shadow: 0 0 10px #8A2BE2, 0 0 20px #8A2BE2;
            letter-spacing: 2px;
        }

        /* Подзаголовок */
        p {
            color: #b084fc;
            margin-bottom: 30px;
            font-size: 16px;
        }

        /* Кнопка Играть */
        .play-btn {
            display: inline-block;
            background: linear-gradient(135deg, #8A2BE2, #FF00FF);
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.9);
        }

        /* Ссылки внизу */
        .links {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .links a {
            color: #b084fc;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .links a:hover {
            color: #FF00FF;
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="container">
        <!-- Вставь сюда ссылку на свой логотип или удали строку, если не нужен -->
        <!-- <img src="ссылка_на_логотип.png" alt="Velaris Logo" class="logo"> -->
        
        <h1>VELARIS</h1>
        <p>Уютное выживание и веселые прятки</p>

        <!-- Главная кнопка запуска игры -->
        <a href="minecraft://connect?server=velarismc.mcsh.io" class="play-btn">Играть</a>

        <div class="links">
            <a href="https://discord.gg/5R7RcuV8GR" target="_blank">Discord</a>
            <a href="https://t.me/Vellrisabot" target="_blank">Поддержка</a>
            <a href="https://www.donationalerts.com/r/velarisprivelege" target="_blank">Донат</a>
        </div>
    </div>

</body>
</html>
