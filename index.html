<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELARIS | Minecraft Server</title>
    <style>
        /* Сброс стилей и настройка фона */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Фоновая картинка */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://raw.githubusercontent.com/mcdnljpg/velaris-site/main/027cd4a1-c7a2-4658-a2f5-45c013d06b27.jpg') no-repeat center center/cover;
            z-index: -1;
        }

        /* Контейнер по центру (теперь прозрачный) */
        .container {
            text-align: center;
            background: transparent; /* Убрали черный фон */
            padding: 40px;
            border-radius: 20px;
            /* Оставили только неоновую рамку для красоты, можешь её тоже убрать, если не нравится */
            border: 2px solid rgba(138, 43, 226, 0.5); 
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.3);
            max-width: 600px;
            width: 90%;
        }

        /* Заголовок */
        h1 {
            font-size: 52px;
            margin: 0 0 15px 0;
            color: #ffffff;
            text-shadow: 2px 2px 4px #000, 0 0 20px #8A2BE2; /* Жесткая тень для читаемости */
            letter-spacing: 4px;
            font-weight: 900;
        }

        /* Подзаголовок */
        p {
            color: #ffffff;
            text-shadow: 1px 1px 3px #000, 0 0 10px #8A2BE2; /* Тень для текста */
            margin-bottom: 40px;
            font-size: 18px;
            font-weight: bold;
        }

        /* Кнопка Играть */
        .play-btn {
            display: inline-block;
            background: linear-gradient(135deg, #8A2BE2, #FF00FF);
            color: white;
            text-decoration: none;
            padding: 18px 60px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid #fff;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 0, 255, 1);
        }

        /* Ссылки внизу */
        .links {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .links a {
            color: #ffffff;
            text-shadow: 1px 1px 3px #000, 0 0 10px #8A2BE2;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .links a:hover {
            color: #FF00FF;
            text-shadow: 0 0 15px #FF00FF;
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="container">
        <h1>VELARIS</h1>
        <p>Уютное выживание и веселые прятки</p>

        <a href="minecraft://connect?server=velarismc.mcsh.io" class="play-btn">Играть</a>

        <div class="links">
            <a href="https://discord.gg/5R7RcuV8GR" target="_blank">Discord</a>
            <a href="https://t.me/Vellrisabot" target="_blank">Поддержка</a>
            <a href="https://www.donationalerts.com/r/velarisprivelege" target="_blank">Донат</a>
        </div>
    </div>

</body>
</html>
