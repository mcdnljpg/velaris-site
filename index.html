<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELARIS | Minecraft Server</title>
    <style>
        /* Сброс стилей и настройка фона */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Твоя фоновая картинка */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://raw.githubusercontent.com/mcdnljpg/velaris-site/main/027cd4a1-c7a2-4658-a2f5-45c013d06b27.jpg') no-repeat center center/cover;
            opacity: 0.5; /* Чуть затемним фон, чтобы текст читался */
            z-index: -1;
        }

        /* Контейнер по центру */
        .container {
            text-align: center;
            background: rgba(10, 10, 10, 0.85); /* Темная полупрозрачная плашка */
            padding: 40px 60px;
            border-radius: 20px;
            border: 2px solid #8A2BE2;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.6);
            max-width: 500px;
            width: 90%;
            backdrop-filter: blur(5px); /* Размытие фона за плашкой */
        }

        /* Заголовок */
        h1 {
            font-size: 42px;
            margin: 0 0 10px 0;
            color: #ffffff;
            text-shadow: 0 0 10px #8A2BE2, 0 0 20px #8A2BE2;
            letter-spacing: 3px;
            font-weight: 800;
        }

        /* Подзаголовок */
        p {
            color: #b084fc;
            margin-bottom: 35px;
            font-size: 16px;
        }

        /* Кнопка Играть */
        .play-btn {
            display: inline-block;
            background: linear-gradient(135deg, #8A2BE2, #FF00FF);
            color: white;
            text-decoration: none;
            padding: 15px 50px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 0, 255, 1);
        }

        /* Ссылки внизу */
        .links {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .links a {
            color: #b084fc;
            text-decoration: none;
            font-size: 15px;
            transition: color 0.3s ease;
            border-bottom: 1px dashed transparent;
        }

        .links a:hover {
            color: #FF00FF;
            border-bottom: 1px dashed #FF00FF;
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="container">
        <h1>VELARIS</h1>
        <p>Уютное выживание и веселые прятки</p>

        <!-- Главная кнопка запуска игры -->
        <a href="minecraft://connect?server=velarismc.mcsh.io" class="play-btn">Играть</a>

        <div class="links">
            <a href="https://discord.gg/5R7RcuV8GR" target="_blank">Discord</a>
            <a href="https://t.me/Vellrisabot" target="_blank">Поддержка</a>
            <a href="https://www.donationalerts.com/r/velarisprivelege" target="_blank">Донат</a>
        </div>
    </div>

</body>
</html>
