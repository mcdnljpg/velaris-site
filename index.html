<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELARIS | Minecraft Server</title>
    <style>
        /* Сброс стилей */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Картинка на весь экран без черных полос */
            background: url('https://raw.githubusercontent.com/mcdnljpg/velaris-site/main/027cd4a1-c7a2-4658-a2f5-45c013d06b27.jpg') no-repeat center center fixed;
            background-size: 100% 100%;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Контейнер для контента */
        .content {
            text-align: center;
            /* Тень для всего блока, чтобы текст читался на фоне */
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.9));
        }

        /* Заголовок */
        h1 {
            font-size: 60px;
            margin: 0 0 10px 0;
            color: #ffffff;
            text-shadow: 0 0 15px #8A2BE2, 0 0 30px #8A2BE2;
            letter-spacing: 5px;
            font-weight: 900;
        }

        /* Подзаголовок */
        p {
            color: #ffffff;
            margin-bottom: 40px;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #8A2BE2;
        }

        /* Кнопка Играть (теперь копирует IP) */
        .play-btn {
            display: inline-block;
            background: linear-gradient(135deg, #8A2BE2, #FF00FF);
            color: white;
            text-decoration: none;
            padding: 18px 60px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            cursor: pointer;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 0, 255, 1);
        }

        /* Ссылки внизу */
        .links {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #8A2BE2;
            transition: color 0.3s ease;
        }

        .links a:hover {
            color: #FF00FF;
            text-shadow: 0 0 15px #FF00FF;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>VELARIS</h1>
        <p>Уютное выживание и веселые прятки</p>

        <!-- Кнопка теперь копирует IP -->
        <button onclick="copyIP()" class="play-btn">Скопировать IP</button>

        <div class="links">
            <a href="https://discord.gg/5R7RcuV8GR" target="_blank">Discord</a>
            <a href="https://t.me/Vellrisabot" target="_blank">Поддержка</a>
            <a href="https://www.donationalerts.com/r/velarisprivelege" target="_blank">Донат</a>
        </div>
    </div>

    <!-- Скрипт для копирования -->
    <script>
        function copyIP() {
            const ip = "velarismc.mcsh.io";
            navigator.clipboard.writeText(ip).then(() => {
                alert("IP скопирован! Вставь его в игре: Сетевая игра -> Добавить сервер.");
            }).catch(err => {
                // Если браузер блокирует буфер обмена, показываем окошко для ручного копирования
                prompt("Скопируй IP вручную:", ip);
            });
        }
    </script>

</body>
</html>
